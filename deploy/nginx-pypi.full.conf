map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name __DOMAIN__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name __DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Backend endpoints (PyPI proxy)
  location ^~ /api/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /simple/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /download/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /npm/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /nuget/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /v2/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /extensions/vsix/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /extensions/feed/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /extensions/gallery/ {
    proxy_pass http://backend:8888;
  }
  location ^~ /_apis/public/gallery/ {
    proxy_pass http://backend:8888;
  }

  # Frontend
  location / {
    # Vite checks allowedHosts; we must pass the real domain, not the upstream name.
    proxy_set_header Host $server_name;
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_redirect off;
  proxy_read_timeout 300;
}
