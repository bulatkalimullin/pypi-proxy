services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8888:8888"
    environment:
      - CACHE_DIR=/app/cache
      - METADATA_TTL_SECONDS=900
      - PYPI_BASE_URL=https://pypi.org
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8888}
      - SIMPLE_INDEX_TTL_SECONDS=86400
      - NPM_REGISTRY_URL=${NPM_REGISTRY_URL:-https://registry.npmjs.org}
      - NUGET_REGISTRY_URL=${NUGET_REGISTRY_URL:-https://api.nuget.org}
      - DOCKER_REGISTRY_URL=${DOCKER_REGISTRY_URL:-https://registry-1.docker.io}
      - DOCKER_AUTH_URL=${DOCKER_AUTH_URL:-https://auth.docker.io/token}
    volumes:
      - ./cache:/app/cache
    networks:
      pypi-net:
        aliases:
          - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8888}
    networks:
      pypi-net:
        aliases:
          - frontend

networks:
  pypi-net:
    external: true
    name: pypi-net
